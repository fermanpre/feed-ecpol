name: Actualizar feed

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC
  workflow_dispatch:        # ejecución manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar feed.xml
        run: python generar_feed.py feed.xml

      # El feed lleva lastBuildDate, así que cambia en cada ejecución: el commit diario
      # mantiene activo el repositorio (GitHub desactiva los workflows programados
      # tras 60 días sin actividad).
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Actualizar feed" || echo "Sin cambios"
          git push
